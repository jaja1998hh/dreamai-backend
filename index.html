<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DreamAI</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b0f;
  color: white;
}

.app {
  max-width: 480px;
  margin: auto;
  padding: 25px;
}

.logo {
  text-align: center;
  font-size: 32px;
  font-weight: bold;
  margin-top: 30px;
}

.subtitle {
  text-align: center;
  color: #aaa;
  margin-bottom: 30px;
}

.card {
  background: #17171d;
  padding: 20px;
  border-radius: 18px;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 8px;
}

input, select {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #333;
  background: #222229;
  color: white;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 20px;
  border: none;
  border-radius: 12px;
  font-size: 17px;
  font-weight: bold;
  background: white;
  color: black;
}

#status {
  text-align: center;
  margin-top: 20px;
  color: #aaa;
}

#result img {
  width: 100%;
  margin-top: 20px;
  border-radius: 15px;
}
</style>
</head>

<body>

<div class="app">

<div class="logo">✨ DreamAI</div>

<div class="subtitle">
Turn your imagination into images
</div>

<div class="card">

<label>Describe your image</label>

<input id="prompt"
placeholder="A beautiful luxury hotel beside the ocean">

<label>Choose style</label>

<select id="style">
<option>Realistic</option>
<option>Cinematic</option>
<option>Anime</option>
<option>3D</option>
<option>Fantasy</option>
</select>

<button onclick="generateImage()">
✨ Generate Image
</button>

</div>

<div id="status"></div>

<div id="result"></div>

</div>

<script>

async function generateImage() {

const prompt =
document.getElementById("prompt").value.trim();

const style =
document.getElementById("style").value;

const status =
document.getElementById("status");

const result =
document.getElementById("result");

if (!prompt) {
status.innerText =
"❌ Please enter an image idea.";
return;
}

status.innerText =
"⏳ Creating your image...";

result.innerHTML = "";

try {

const response = await fetch(
"https://dreamai-api-m1vw.onrender.com/generate",
{
method: "POST",

headers: {
"Content-Type": "application/json"
},

body: JSON.stringify({
prompt: prompt,
style: style
})
}
);

if (!response.ok) {
throw new Error("Image generation failed");
}

const blob = await response.blob();

const imageURL =
URL.createObjectURL(blob);

result.innerHTML =
'<img src="' +
imageURL +
'" alt="Generated image">';

status.innerText =
"✅ Image generated!";

}

catch (error) {

status.innerText =
"❌ " + error.message;

}

}

</script>

</body>
</html>
